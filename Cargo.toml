[workspace]
resolver = "2"
members = ["crates/spoor-core", "crates/spoor-cli"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/P0m32Kun/Spoor"
rust-version = "1.93"

[workspace.dependencies]
oxc_allocator = "0.133"
oxc_ast = "0.133"
oxc_ast_visit = "0.133"
oxc_parser = "0.133"
oxc_span = "0.133"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
clap = { version = "4", features = ["derive"] }
